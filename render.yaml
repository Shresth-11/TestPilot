services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: testpilot-backend
    env: python
    buildCommand: pip install -e backend/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: testpilot-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOW_LOCAL_TARGETS
        value: "true"

  # 2. React Developer Dashboard Frontend (Static Site - Always Free)
  - type: web
    name: testpilot-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Managed PostgreSQL Database (Free Tier)
databases:
  - name: testpilot-db
    databaseName: testpilot
    user: testpilot_user
    plan: free
